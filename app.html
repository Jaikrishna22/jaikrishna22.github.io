<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TNPSC Portal App</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #1e3c72; --secondary: #2a5298; --accent: #e74c3c;
    --success: #27ae60; --light: #ecf0f1; --text: #34495e;
  }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #f0f2f8; color: var(--text);
    padding-bottom: 70px; /* room for mobile bottom nav */
  }
  /* ---------- Top bar ---------- */
  .topbar {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: white; padding: 14px 16px; position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
  }
  .topbar h1 { font-size: 1.2em; }
  .topbar .user-chip {
    background: rgba(255,255,255,0.2); padding: 5px 12px;
    border-radius: 15px; font-size: 0.85em;
  }
  /* ---------- Desktop nav (hidden on mobile) ---------- */
  .desktop-nav { display: none; gap: 4px; }
  .desktop-nav button {
    background: transparent; border: none; color: white; padding: 10px 16px;
    cursor: pointer; font-size: 0.95em; border-radius: 8px; font-weight: 500;
  }
  .desktop-nav button.active { background: rgba(255,255,255,0.25); }
  .desktop-nav button:hover { background: rgba(255,255,255,0.15); }
  /* ---------- Mobile bottom nav ---------- */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    background: white; display: flex; box-shadow: 0 -2px 12px rgba(0,0,0,0.12);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .bottom-nav button {
    flex: 1; background: none; border: none; padding: 8px 0 6px;
    font-size: 0.7em; color: #888; cursor: pointer;
  }
  .bottom-nav button .icon { display: block; font-size: 1.7em; margin-bottom: 2px; }
  .bottom-nav button.active { color: var(--secondary); font-weight: 600; }
  /* ---------- Layout ---------- */
  .container { max-width: 900px; margin: 0 auto; padding: 16px; }
  .card {
    background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  h2 { color: var(--primary); margin-bottom: 12px; font-size: 1.3em; }
  input, select {
    width: 100%; padding: 12px; border: 2px solid var(--light);
    border-radius: 8px; font-size: 1em; margin-bottom: 10px;
  }
  input:focus { outline: none; border-color: var(--secondary); }
  .btn {
    background: var(--secondary); color: white; border: none; padding: 12px 20px;
    border-radius: 8px; font-size: 1em; font-weight: 600; cursor: pointer; width: 100%;
  }
  .btn:hover { background: var(--primary); }
  .btn.small { width: auto; padding: 8px 16px; font-size: 0.9em; }
  .btn.danger { background: var(--accent); }
  .btn.success { background: var(--success); }
  /* ---------- Vocabulary cards ---------- */
  .vocab-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .vocab-card {
    background: white; border-radius: 12px; padding: 14px;
    display: flex; gap: 14px; align-items: flex-start;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .vocab-card .emoji {
    font-size: 2em; background: linear-gradient(135deg, rgba(42,82,152,0.08), rgba(52,152,219,0.08));
    border-radius: 10px; padding: 10px; line-height: 1;
  }
  .vocab-card .brit { color: var(--primary); font-weight: 700; }
  .vocab-card .amer { color: var(--accent); font-weight: 700; }
  .vocab-card .tip { font-size: 0.85em; color: #777; margin-top: 6px; }
  /* ---------- Quiz ---------- */
  .option {
    display: block; padding: 12px; margin: 6px 0; border: 2px solid var(--light);
    border-radius: 8px; cursor: pointer; transition: all 0.15s;
  }
  .option:hover { border-color: var(--secondary); }
  .option.selected { border-color: var(--secondary); background: rgba(42,82,152,0.08); }
  .option.correct { border-color: var(--success); background: rgba(39,174,96,0.1); }
  .option.wrong { border-color: var(--accent); background: rgba(231,76,60,0.1); }
  .q-num { font-size: 0.8em; color: #999; }
  .score-banner {
    text-align: center; padding: 24px; border-radius: 12px; color: white;
    background: linear-gradient(135deg, var(--success), #229954); margin-bottom: 16px;
  }
  .score-banner .big { font-size: 2.4em; font-weight: 700; }
  /* ---------- News ---------- */
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px; }
  .chip {
    border: 2px solid var(--secondary); background: white; color: var(--secondary);
    padding: 6px 14px; border-radius: 20px; font-size: 0.85em; font-weight: 600;
    cursor: pointer; white-space: nowrap;
  }
  .chip.active { background: var(--secondary); color: white; }
  .news-src { font-size: 0.75em; font-weight: 700; padding: 3px 10px; border-radius: 12px; color: white; }
  .src-thanthi { background: #ff6b35; }
  .src-hindu { background: #004d99; }
  .src-tnpsc { background: var(--success); }
  .src-other { background: #888; }
  /* ---------- Tables ---------- */
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--light); }
  th { color: var(--primary); }
  .rank-1 { color: #f1c40f; font-weight: 700; }
  .rank-2 { color: #95a5a6; font-weight: 700; }
  .rank-3 { color: #cd7f32; font-weight: 700; }
  .muted { color: #999; font-size: 0.9em; }
  .error-msg { background: #fdecea; color: #c0392b; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
  .ok-msg { background: #e8f8f0; color: #1e8449; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
  .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
  .stat { text-align: center; background: var(--light); border-radius: 10px; padding: 12px 6px; }
  .stat .val { font-size: 1.5em; font-weight: 700; color: var(--secondary); }
  .stat .lbl { font-size: 0.75em; color: #777; }
  /* ---------- Desktop: >= 768px ---------- */
  @media (min-width: 768px) {
    body { padding-bottom: 0; }
    .bottom-nav { display: none; }
    .desktop-nav { display: flex; }
    .vocab-grid { grid-template-columns: 1fr 1fr; }
    .topbar { padding: 14px 24px; }
    .topbar h1 { font-size: 1.4em; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect, useCallback } = React;
const html = htm.bind(React.createElement);

// API base resolution:
// - served by the API itself (localhost:5199 or Azure) -> same origin ('')
// - served from GitHub Pages / Netlify -> defaults to your local API; change it
//   in Account -> API Server after you deploy the backend to Azure.
function defaultApiBase() {
  const h = location.hostname;
  if (h.endsWith('github.io') || h.endsWith('netlify.app')) return 'http://localhost:5199';
  return '';
}
const API_BASE = localStorage.getItem('apiBase') || defaultApiBase();

function apiFetch(path, options = {}) {
  const token = localStorage.getItem('token');
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  return fetch(API_BASE + path, { ...options, headers }).then(async res => {
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ('Request failed (' + res.status + ')'));
    return data;
  });
}

/* ================= Vocabulary ================= */
function VocabTab() {
  const [items, setItems] = useState([]);
  const [total, setTotal] = useState(0);
  const [search, setSearch] = useState('');
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    setLoading(true);
    const t = setTimeout(() => {
      apiFetch('/api/vocabulary?pageSize=100&search=' + encodeURIComponent(search))
        .then(d => { setItems(d.items); setTotal(d.total); })
        .catch(() => {})
        .finally(() => setLoading(false));
    }, 250);
    return () => clearTimeout(t);
  }, [search]);

  return html`<div>
    <h2>📖 Vocabulary <span class="muted">(${total})</span></h2>
    <input placeholder="🔍 Search e.g. colour, flat, petrol..."
           value=${search} onInput=${e => setSearch(e.target.value)} />
    ${loading && html`<p class="muted">Loading...</p>`}
    <div class="vocab-grid">
      ${items.map(v => html`<div class="vocab-card" key=${v.id}>
        <div class="emoji">${v.emojiIcon || '📖'}</div>
        <div>
          <div><span class="brit">🇬🇧 ${v.britishWord}</span> / <span class="amer">🇺🇸 ${v.americanWord}</span></div>
          <div class="muted">${v.definition}</div>
          ${v.tnpscTip && html`<div class="tip">💡 ${v.tnpscTip}</div>`}
        </div>
      </div>`)}
    </div>
  </div>`;
}

/* ================= Quiz ================= */
function QuizTab({ user }) {
  const [quizzes, setQuizzes] = useState([]);
  const [quiz, setQuiz] = useState(null);       // active quiz detail
  const [answers, setAnswers] = useState({});
  const [result, setResult] = useState(null);
  const [error, setError] = useState('');

  useEffect(() => { apiFetch('/api/quizzes').then(setQuizzes).catch(() => {}); }, []);

  const openQuiz = id => {
    setResult(null); setAnswers({}); setError('');
    apiFetch('/api/quizzes/' + id).then(setQuiz).catch(e => setError(e.message));
  };

  const submit = () => {
    setError('');
    apiFetch('/api/quizzes/' + quiz.id + '/submit', {
      method: 'POST', body: JSON.stringify({ answers }),
    }).then(setResult).catch(e => setError(e.message + (user ? '' : ' — login first (Account tab)')));
  };

  if (result) {
    const map = {}; result.results.forEach(r => map[r.questionId] = r);
    return html`<div>
      <div class="score-banner">
        <div class="big">${result.score}/${result.total}</div>
        <div>${result.percentage}% ${result.percentage >= 60 ? '🎉 Great job!' : '💪 Keep practising!'}</div>
      </div>
      ${quiz.questions.map((q, i) => {
        const r = map[q.id];
        return html`<div class="card" key=${q.id}>
          <div class="q-num">Question ${i + 1}</div>
          <p><strong>${q.text}</strong></p>
          ${['a','b','c','d'].map(k => {
            const label = q['option' + k.toUpperCase()];
            let cls = 'option';
            if (r) {
              if (k === r.correctAnswer) cls += ' correct';
              else if (k === r.userAnswer && !r.isCorrect) cls += ' wrong';
            }
            return html`<div class=${cls} key=${k}>${k.toUpperCase()}. ${label}</div>`;
          })}
          ${r && r.explanation && html`<p class="tip">💡 ${r.explanation}</p>`}
        </div>`;
      })}
      <button class="btn" onClick=${() => { setResult(null); setQuiz(null); }}>← Back to quizzes</button>
    </div>`;
  }

  if (quiz) {
    const answered = Object.keys(answers).length;
    return html`<div>
      <h2>${quiz.title}</h2>
      <p class="muted">${answered}/${quiz.questions.length} answered</p>
      ${error && html`<div class="error-msg">${error}</div>`}
      ${quiz.questions.map((q, i) => html`<div class="card" key=${q.id}>
        <div class="q-num">Question ${i + 1}</div>
        <p><strong>${q.text}</strong></p>
        ${['a','b','c','d'].map(k => html`<div key=${k}
            class=${'option' + (answers[q.id] === k ? ' selected' : '')}
            onClick=${() => setAnswers({ ...answers, [q.id]: k })}>
          ${k.toUpperCase()}. ${q['option' + k.toUpperCase()]}
        </div>`)}
      </div>`)}
      <button class="btn success" onClick=${submit}>✓ Submit Quiz</button>
      <br/><br/>
      <button class="btn danger" onClick=${() => setQuiz(null)}>✕ Cancel</button>
    </div>`;
  }

  return html`<div>
    <h2>🎯 Practice Quizzes</h2>
    ${quizzes.map(q => html`<div class="card" key=${q.id}>
      <strong>${q.title}</strong>
      <p class="muted">${q.description}</p>
      <p class="muted">📝 ${q.questionCount} questions · ⏱️ ${q.durationMinutes} min · ${q.difficulty}</p>
      <br/>
      <button class="btn small" onClick=${() => openQuiz(q.id)}>Start →</button>
    </div>`)}
  </div>`;
}

/* ================= Leaderboard ================= */
function LeaderboardTab() {
  const [rows, setRows] = useState([]);
  useEffect(() => { apiFetch('/api/users/leaderboard').then(setRows).catch(() => {}); }, []);
  return html`<div>
    <h2>🏆 Leaderboard</h2>
    <div class="card">
      <table>
        <thead><tr><th>#</th><th>Student</th><th>Score</th><th>Quizzes</th></tr></thead>
        <tbody>
          ${rows.map((r, i) => html`<tr key=${i}>
            <td class=${'rank-' + (i + 1)}>${i < 3 ? ['🥇','🥈','🥉'][i] : i + 1}</td>
            <td>${r.username}</td><td>${r.totalScore}</td><td>${r.quizzesCompleted}</td>
          </tr>`)}
          ${rows.length === 0 && html`<tr><td colSpan="4" class="muted">No results yet — take a quiz!</td></tr>`}
        </tbody>
      </table>
    </div>
  </div>`;
}

/* ================= News ================= */
function NewsTab() {
  const [items, setItems] = useState([]);
  const [filter, setFilter] = useState('all');
  useEffect(() => {
    let qs = '';
    if (filter === 'tnpsc') qs = '?tnpsc=true';
    else if (filter !== 'all') qs = '?source=' + filter;
    apiFetch('/api/news' + qs).then(setItems).catch(() => {});
  }, [filter]);
  const chips = [['all','📰 All'],['thanthi','தந்தி Thanthi'],['hindu','The Hindu'],['tnpsc','🎯 TNPSC']];
  return html`<div>
    <h2>📰 Daily News</h2>
    <div class="chips">
      ${chips.map(([k, label]) => html`<button key=${k}
        class=${'chip' + (filter === k ? ' active' : '')}
        onClick=${() => setFilter(k)}>${label}</button>`)}
    </div>
    ${items.map(n => html`<div class="card" key=${n.id}>
      <span class=${'news-src src-' + n.source}>${n.source.toUpperCase()}</span>
      ${n.isTnpscRelevant && html` <span class="news-src src-tnpsc">🎯 TNPSC</span>`}
      <p style=${{ margin: '8px 0', fontWeight: 600, color: 'var(--primary)' }}>${n.title}</p>
      <p class="muted">${n.summary}</p>
      <p class="tip">📅 ${n.publishedDate}</p>
    </div>`)}
  </div>`;
}

/* ================= API server settings ================= */
function ApiSettings() {
  const [value, setValue] = useState(API_BASE);
  const save = () => {
    const v = value.trim().replace(/\/+$/, '');
    if (v) localStorage.setItem('apiBase', v);
    else localStorage.removeItem('apiBase');
    location.reload();
  };
  return html`<div class="card">
    <strong>⚙️ API Server</strong>
    <p class="muted">Where this app fetches data from. After deploying the backend
      to Azure, paste its URL here (e.g. https://tnpsc-api.azurewebsites.net).</p>
    <br/>
    <input placeholder="Same origin (default)" value=${value}
           onInput=${e => setValue(e.target.value)} />
    <button class="btn small" onClick=${save}>Save & Reload</button>
  </div>`;
}

/* ================= Account ================= */
function AccountTab({ user, setUser }) {
  const [mode, setMode] = useState('login');
  const [form, setForm] = useState({ username: '', email: '', password: '', tnpscGroup: 'group2' });
  const [msg, setMsg] = useState(null);
  const [stats, setStats] = useState(null);

  useEffect(() => {
    if (user) apiFetch('/api/users/me').then(d => setStats(d.stats)).catch(() => {});
  }, [user]);

  const submit = () => {
    setMsg(null);
    const path = mode === 'login' ? '/api/auth/login' : '/api/auth/register';
    apiFetch(path, { method: 'POST', body: JSON.stringify(form) })
      .then(d => {
        localStorage.setItem('token', d.token);
        localStorage.setItem('user', JSON.stringify(d.user));
        setUser(d.user);
        setMsg({ ok: true, text: mode === 'login' ? 'Welcome back!' : 'Account created!' });
      })
      .catch(e => setMsg({ ok: false, text: e.message }));
  };

  const goPremium = () => {
    setMsg(null);
    apiFetch('/api/payments/create-order', { method: 'POST' })
      .then(o => apiFetch('/api/payments/verify', {
        method: 'POST',
        body: JSON.stringify({ orderId: o.orderId, paymentId: 'pay_test_ui' }),
      }))
      .then(v => {
        const updated = { ...user, membershipType: v.membership, membershipValidUntil: v.validUntil };
        localStorage.setItem('user', JSON.stringify(updated));
        setUser(updated);
        setMsg({ ok: true, text: '💎 Premium activated (test mode) until ' + String(v.validUntil).slice(0, 10) });
      })
      .catch(e => setMsg({ ok: false, text: e.message }));
  };

  const logout = () => {
    localStorage.removeItem('token'); localStorage.removeItem('user');
    setUser(null); setStats(null);
  };

  if (user) {
    return html`<div>
      <h2>👤 My Account</h2>
      ${msg && html`<div class=${msg.ok ? 'ok-msg' : 'error-msg'}>${msg.text}</div>`}
      <div class="card">
        <p><strong>${user.username}</strong> · ${user.email}</p>
        <p class="muted">Group: ${user.tnpscGroup || '—'} · Membership:
          ${user.membershipType === 'premium' ? ' 💎 Premium' : ' Free'}</p>
        ${stats && html`<div class="stat-row">
          <div class="stat"><div class="val">${stats.quizzesCompleted}</div><div class="lbl">Quizzes</div></div>
          <div class="stat"><div class="val">${stats.totalScore}</div><div class="lbl">Total Score</div></div>
          <div class="stat"><div class="val">${stats.averagePercentage}%</div><div class="lbl">Average</div></div>
        </div>`}
        ${user.membershipType !== 'premium' && html`
          <button class="btn success" onClick=${goPremium}>💎 Upgrade to Premium (₹299 · test mode)</button><br/><br/>`}
        <button class="btn danger" onClick=${logout}>Logout</button>
      </div>
      <${ApiSettings} />
    </div>`;
  }

  return html`<div>
    <h2>${mode === 'login' ? '🔐 Login' : '📝 Sign Up'}</h2>
    ${msg && html`<div class=${msg.ok ? 'ok-msg' : 'error-msg'}>${msg.text}</div>`}
    <div class="card">
      <input placeholder="Username" value=${form.username}
             onInput=${e => setForm({ ...form, username: e.target.value })} />
      ${mode === 'register' && html`
        <input placeholder="Email" type="email" value=${form.email}
               onInput=${e => setForm({ ...form, email: e.target.value })} />
        <select value=${form.tnpscGroup} onChange=${e => setForm({ ...form, tnpscGroup: e.target.value })}>
          <option value="group1">Group 1</option>
          <option value="group2">Group 2/2A</option>
          <option value="group4">Group 4</option>
        </select>`}
      <input placeholder="Password (min 8 chars)" type="password" value=${form.password}
             onInput=${e => setForm({ ...form, password: e.target.value })} />
      <button class="btn" onClick=${submit}>${mode === 'login' ? '✓ Login' : '✓ Create Account'}</button>
      <p style=${{ textAlign: 'center', marginTop: '12px' }}>
        <a href="#" onClick=${e => { e.preventDefault(); setMode(mode === 'login' ? 'register' : 'login'); setMsg(null); }}
           style=${{ color: 'var(--secondary)' }}>
          ${mode === 'login' ? "New here? Sign up →" : '← Already have an account? Login'}
        </a>
      </p>
    </div>
    <${ApiSettings} />
  </div>`;
}

/* ================= App shell ================= */
const TABS = [
  ['vocab', '📖', 'Vocabulary'],
  ['quiz', '🎯', 'Quiz'],
  ['leaderboard', '🏆', 'Ranks'],
  ['news', '📰', 'News'],
  ['account', '👤', 'Account'],
];

function App() {
  const [tab, setTab] = useState('vocab');
  const [user, setUser] = useState(() => {
    try { return JSON.parse(localStorage.getItem('user')); } catch { return null; }
  });

  const view = {
    vocab: html`<${VocabTab} />`,
    quiz: html`<${QuizTab} user=${user} />`,
    leaderboard: html`<${LeaderboardTab} />`,
    news: html`<${NewsTab} />`,
    account: html`<${AccountTab} user=${user} setUser=${setUser} />`,
  }[tab];

  return html`<div>
    <div class="topbar">
      <h1>📚 TNPSC Portal</h1>
      <nav class="desktop-nav">
        ${TABS.map(([k, icon, label]) => html`<button key=${k}
          class=${tab === k ? 'active' : ''} onClick=${() => setTab(k)}>${icon} ${label}</button>`)}
      </nav>
      <span class="user-chip">${user ? '👤 ' + user.username : 'Guest'}</span>
    </div>
    <div class="container">${view}</div>
    <nav class="bottom-nav">
      ${TABS.map(([k, icon, label]) => html`<button key=${k}
        class=${tab === k ? 'active' : ''} onClick=${() => setTab(k)}>
        <span class="icon">${icon}</span>${label}
      </button>`)}
    </nav>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
