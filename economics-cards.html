<script>

var q=document.getElementById('q'),cat=document.getElementById('cat'),count=document.getElementById('count');
function apply(){var n=q.value.trim().toLowerCase(),c=cat.value,shown=0;
figs.forEach(function(f){var ok=(!c||f.getAttribute('data-cat')===c)&&(!n||f.getAttribute('data-s').indexOf(n)>=0);
